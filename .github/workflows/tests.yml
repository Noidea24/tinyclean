name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Debian 12, the transcoder containers' system, ships.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile tinyclean.py
      - name: Test
        run: python -m pytest -q
