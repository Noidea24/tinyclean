name: dashboard image

# Publishes ghcr.io/<owner>/mediatool-dashboard when a release is published on GitHub,
# tagged with the release (v8.3) and :latest. Komodo pulls :latest.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Names
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediatool-dashboard" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' engine/tinyclean.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:v${{ steps.names.outputs.version }}
      - name: Smoke test
        run: |
          hash=$(docker run --rm "${{ steps.names.outputs.image }}:latest" python -c "import sys; sys.path.insert(0, '/app'); import server; print(server.make_hash('smoke-test-password', 1000))")
          docker run -d --name smoke -p 8780:8780 -e MEDIATOOL_PASSWORD_HASH="$hash" \
            -e MEDIATOOL_AGENTS="w=http://127.0.0.1:9=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" "${{ steps.names.outputs.image }}:latest"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8780/healthz && curl -fsS http://127.0.0.1:8780/ | grep -q mediatool && exit 0; sleep 2; done
          docker logs smoke
          exit 1
